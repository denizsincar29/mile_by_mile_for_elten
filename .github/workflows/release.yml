name: Release signed Elten app

# Builds and signs the app in this repository with the developer's own
# certificate (kept only in GitHub secrets — never uploaded to any third-party
# server) and produces the .eltsetup package the Elten catalog accepts.
#
# Triggers:
#   - push of a tag v*  -> also creates a GitHub Release with the package
#   - workflow_dispatch -> just builds + uploads the artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Elten build tools (pinned to Elten 3.0.2)
        uses: actions/checkout@v4
        with:
          repository: dawidpieper/elten3
          ref: 3.0.2
          path: elten3
          sparse-checkout: |
            tools/build-eltenapp.rb
            tools/build-eltsetup.rb
            src/eapi/programsigning.rb
            src/eapi/resources.rb
            src/eapi/program_package_metadata.rb
          sparse-checkout-cone-mode: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install zstd-ruby
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev
          gem install zstd-ruby --no-document

      - name: Patch case-sensitive require (upstream tools assume Windows FS)
        run: |
          sed -i 's#require_relative "../src/EAPI/ProgramSigning"#require_relative "../src/eapi/programsigning"#' \
            elten3/tools/build-eltenapp.rb elten3/tools/build-eltsetup.rb

      - name: Write signing certificate from secrets
        run: |
          umask 077
          echo "${{ secrets.MILEBYMILE_CERT }}" | base64 -d > /tmp/mile.crt.pem
          echo "${{ secrets.MILEBYMILE_KEY }}" | base64 -d > /tmp/mile.key.pem

      - name: Run engine tests
        run: ruby test/mile_by_mile_test.rb

      - name: Build signed package
        run: |
          VERSION="$(ruby -rjson -e 'd=File.read(%(src/__app.rb)); m=d[/\A=begin Elten3AppInfo(.*?)=end Elten3AppInfo/m,1]; puts JSON.parse(m)[%q(version)]')"
          echo "version=$VERSION"
          ruby elten3/tools/build-eltsetup.rb \
            --cert /tmp/mile.crt.pem \
            --key /tmp/mile.key.pem \
            src "MileByMile-$VERSION.eltsetup"
          ls -la MileByMile-*.eltsetup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eltsetup
          path: MileByMile-*.eltsetup

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" MileByMile-*.eltsetup \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Signed .eltsetup built in CI. Install via Elten."
